[project]
name = "sangad"
version = "0.1.0"
description = "Admin Management Dashboard (micro-SaaS)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "redis>=5.2",
    "rq>=2.1",
    "cryptography>=44.0",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.20",
    "jinja2>=3.1",
    "weasyprint>=63",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "python-docx>=1.1",
    "docxtpl>=0.19",
    "boto3>=1.36",
    "httpx>=0.28",
    "email-validator>=2.2",
    "sentry-sdk>=2.20",
    "structlog>=25.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "factory-boy>=3.3",
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "SIM", "ARG", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[project.scripts]
sangad-api = "app.main:run"